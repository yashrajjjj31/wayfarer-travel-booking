services:
  - type: web
    name: wayfarer-travel
    runtime: node
    # A paid instance is required because Render does not allow persistent disks on Free.
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    disk:
      name: wayfarer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        generateValue: true
      - key: NOTIFY_PHONE
        value: +917774004950
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
