<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Trip details — Wayfarer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#172b27;--muted:#718079;--paper:#f7f6f2;--green:#1b443a;--lime:#d8f078;--line:#e6e7df;--serif:Georgia,'Times New Roman',serif;--sans:'DM Sans',sans-serif;--display:'Manrope',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px var(--sans)}a{color:inherit}.wrap{max-width:1160px;width:calc(100% - 72px);margin:auto}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 22px var(--display);letter-spacing:-1px;text-decoration:none;display:flex;align-items:center;gap:9px}.mark{width:31px;height:31px;border-radius:50% 50% 50% 6px;background:var(--lime);display:grid;place-items:center}.nav a.back{font-size:12px;text-decoration:none;color:#617068}.hero{height:500px;border-radius:12px;overflow:hidden;position:relative;background:#d5ddd5 center/cover;display:flex;align-items:end}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#102722d9,transparent 75%)}.hero-copy{position:relative;z-index:1;color:white;padding:48px 7%;max-width:750px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--lime);font-weight:700}.hero h1{font:500 clamp(48px,7vw,83px)/1 var(--serif);letter-spacing:-2px;margin:15px 0}.hero p{font-size:14px;color:#edf1ed;line-height:1.7;margin:0}.hero-meta{position:absolute;right:28px;bottom:28px;color:white;z-index:1;font-size:12px}.crumb{padding:24px 0 2px;font-size:11px;color:#77847d}.crumb a{text-decoration:none}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:54px}.main{min-width:0}.intro{padding:37px 0 24px;border-bottom:1px solid var(--line)}.intro h2,.section-title{font:500 39px/1.12 var(--serif);letter-spacing:-.8px;margin:10px 0}.intro p{font-size:14px;color:#69776f;line-height:1.8;max-width:710px}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:#718079;font-weight:700}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:22px 0;border-bottom:1px solid var(--line)}.fact{font-size:11px;color:#6d7b73;line-height:1.5}.fact b{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}.photos{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:180px 180px;gap:10px;margin:24px 0}.photo{background:#e6e8e1 center/cover;border-radius:8px}.photo:first-child{grid-row:span 2}.section{padding:35px 0 8px}.section-title{font-size:34px}.highlights{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.highlight{display:flex;gap:11px;align-items:start;color:#526158;font-size:12px;line-height:1.6}.tick{flex:0 0 22px;height:22px;border-radius:50%;background:#e4ebdc;display:grid;place-items:center;color:#335b42;font-size:12px}.timeline{margin-top:20px}.day{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.day-num{font:italic 15px var(--serif);color:#87a07f}.day h3{font:600 14px var(--display);margin:0 0 5px}.day p{font-size:12px;color:#718079;line-height:1.65;margin:0}.sidebar{padding-top:38px}.book-card{position:sticky;top:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 9px 30px #26392c08}.rating{font-size:12px;color:#59685f}.price{font:700 25px var(--display);margin-top:20px}.price small{font:400 11px var(--sans);color:#829087}.trip-spec{margin:17px 0 20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:#68766e;display:flex;justify-content:space-between}.button{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:999px;background:var(--green);color:white;font-size:12px;font-weight:700}.note{font-size:10px;color:#87928b;text-align:center;line-height:1.6;margin:12px 0 0}.side-link{display:block;text-align:center;margin-top:17px;font-size:11px;color:#5f7167}.more{margin:65px auto 70px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.more h2{font:500 29px var(--serif);margin:7px 0}.more a{font-size:12px;color:var(--green);font-weight:700}.foot{border-top:1px solid var(--line);padding:24px 0 30px;color:#839087;font-size:11px;display:flex;justify-content:space-between}@media(max-width:850px){.grid{grid-template-columns:1fr;gap:0}.sidebar{padding-top:24px}.book-card{position:static}.hero{height:430px}.facts{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.wrap{width:calc(100% - 34px)}.nav{height:67px}.hero{height:420px;border-radius:0 0 18px 18px}.hero-copy{padding:34px 7%}.hero h1{font-size:52px}.hero-meta{font-size:9px;right:16px;bottom:16px}.intro{padding-top:27px}.intro h2{font-size:34px}.facts{grid-template-columns:1fr 1fr;row-gap:17px}.photos{grid-template-rows:135px 135px;gap:7px}.highlights{grid-template-columns:1fr}.section-title{font-size:31px}.more{gap:14px;align-items:start;flex-direction:column}.foot{align-items:center;gap:12px;flex-direction:column}}
</style></head>
<body><header class="nav wrap"><a class="brand" href="/"><span class="mark">↗</span>wayfarer.</a><a class="back" href="/#destinations">← &nbsp; All trips</a></header><main id="content" class="wrap"><div class="intro"><p>Loading this place…</p></div></main><script>
const id=location.pathname.split('/').filter(Boolean).pop();const money=n=>'₹'+Number(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const photo=(id,w=1000)=>`https://images.unsplash.com/${encodeURIComponent(id)}?auto=format&fit=crop&w=${w}&q=88`;
async function load(){const root=document.querySelector('#content');try{const all=await fetch('/api/destinations').then(r=>r.json());const d=all.find(x=>x.id===id);if(!d)throw Error('This trip could not be found.');document.title=`${d.name} — Wayfarer`;root.innerHTML=`<section class="hero" style="background-image:url('${photo(d.image,1800)}')"><div class="hero-copy"><div class="eyebrow">${esc(d.tag)} &nbsp;·&nbsp; ${esc(d.category)}</div><h1>${esc(d.name)}</h1><p>${esc(d.description)}</p></div><div class="hero-meta">★ ${esc(d.rating)} &nbsp;·&nbsp; ${esc(d.days)} days</div></section><div class="crumb"><a href="/">Home</a> &nbsp; / &nbsp; <a href="/#destinations">${esc(d.region)}</a> &nbsp; / &nbsp; ${esc(d.country)}</div><div class="grid"><div class="main"><section class="intro"><div class="kicker">${esc(d.city)}</div><h2>A closer look at ${esc(d.country)}.</h2><p>${esc(d.overview)}</p></section><div class="facts"><div class="fact"><b>Best time to go</b>${esc(d.bestTime)}</div><div class="fact"><b>Language</b>${esc(d.language)}</div><div class="fact"><b>Local currency</b>${esc(d.currency)}</div></div><div class="photos">${d.gallery.map((p,i)=>`<div class="photo" style="background-image:url('${photo(p,i?750:1150)}')" role="img" aria-label="${esc(d.country)} travel photo ${i+1}"></div>`).join('')}</div><section class="section"><div class="kicker">Little moments, big memories</div><h2 class="section-title">What you'll remember</h2><div class="highlights">${d.highlights.map(h=>`<div class="highlight"><span class="tick">✓</span><span>${esc(h)}</span></div>`).join('')}</div></section><section class="section"><div class="kicker">A thoughtfully paced trip</div><h2 class="section-title">Your ${esc(d.days)}-day itinerary</h2><div class="timeline">${d.itinerary.map(day=>`<article class="day"><div class="day-num">DAY ${esc(day[0])}</div><div><h3>${esc(day[1])}</h3><p>${esc(day[2])}</p></div></article>`).join('')}</div></section></div><aside class="sidebar"><div class="book-card"><div class="rating">★ ${esc(d.rating)} &nbsp;·&nbsp; Guest favourite</div><div class="price">${money(d.price)} <small>/ person</small></div><div class="trip-spec"><span>${esc(d.days)} days</span><span>Small group</span><span>${esc(d.country)}</span></div><a class="button" href="/?book=${encodeURIComponent(d.id)}">Request this trip &nbsp; ↗</a><p class="note">No payment now. Request a place and the trip team will follow up with availability and details.</p><a href="mailto:hello@wayfarer.travel" class="side-link">Questions? Say hello</a></div></aside></div><section class="more"><div><div class="kicker">Keep looking around</div><h2>Another place might be calling.</h2></div><a href="/#destinations">Explore all trips &nbsp; ↗</a></section><footer class="foot"><a class="brand" href="/" style="font-size:16px"><span class="mark" style="width:25px;height:25px">↗</span>wayfarer.</a><span>© 2026 Wayfarer Travel Co.</span></footer>`}catch(e){root.innerHTML=`<div class="intro"><h2>We couldn't find that trip.</h2><p>${esc(e.message)}</p><a href="/#destinations">Back to all trips ↗</a></div>`}}load();
</script></body></html>
